$color = rgba(0, 0, 0, 1)
$inner_color = rgba(0, 0, 0, 0.66)
$outer_color = rgba(116, 116, 116, 1)
$font_color = rgba(255, 255, 255, 1)
$check_color = rgba(134, 134, 134, 1)

background {
    monitor =
    path = $HOME/.config/background
    blur_size = 4
    blur_passes = 3
    brightness = 0.5
    color = $color
}

image {
    monitor =
    path = $HOME/.config/hypr/avatar.jpg
    size = 320
    border_size = 4

    position = 0, 0
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 64

    dots_size = 0.36
    dots_spacing = 0.32
    dots_center = true
    dots_rounding = -1

    outline_thickness = 3
    inner_color = $inner_color
    outer_color = $outer_color
    font_color = $font_color

    check_color = $check_color
    fail_color = rgba(ff6060ee)

    fade_on_empty = true
    fade_timeout = 1000
    hide_input = false

    placeholder_text = <i></i>
    fail_text = FAIL <b>($ATTEMPTS)</b>

    position = 0,-240
    halign = center
    valign = center

    rounding = -1
}

# -------- CLOCK --------
label {
    monitor =
    text = $TIME
    color = $font_color
    font_size = 128
    font_family = sans-serif Bold

    position = 0, 640
    halign = center
    valign = center
}

# -------- DATE --------
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = $font_color
    font_size = 48
    font_family = sans-serif

    position = 0, 480
    halign = center
    valign = center
}

animations {
    enabled = true
}
