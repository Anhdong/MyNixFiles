

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=1
edge_scroller_pointer_focus=1
scroller_ignore_proportion_single=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
smartgaps=0
default_mfact=0.55
default_nmaster=1


# Overview Setting
hotarea_size=10
enable_hotarea=1
overviewgappi=5
overviewgappo=30

# Misc
xwayland_persistence=1
syncobj_enable=1
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
circle_layout=fair, scroller
enable_floating_snap=1
snap_distance=50
cursor_size=23
cursor_theme=Bibata-Modern-Classic
cursor_hide_timeout=0
drag_tile_to_tile=1
single_scratchpad = 1

# keyboard
repeat_rate=25
repeat_delay=600
numlockon=1
xkb_rules_layout=us

# Trackpad 
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
mouse_natural_scrolling=0
trackpad_natural_scrolling=1
swipe_min_threshold=1
# scroll_button=274
# scroll_method=1


# sub config load
source=./style.conf
source=./bind.conf
source=./rule.conf
source=./monitor.conf
source=./tag.conf

# run autostart
exec-once=~/.config/mango/autostart.sh
