# Window Rules

#Main Menu
window_rule=is_floating:1,no_animation:1,app_id:menu

window_rule=no_swallow:1,app_id:^com.gabm.satty$
window_rule=is_fullscreen:1,app_id:^com.gabm.satty$
window_rule=animation_type_open:none,app_id:^com.gabm.satty$
window_rule=animation_type_close:none,app_id:^com.gabm.satty$
window_rule=is_overlay:1,app_id:^com.gabm.satty$
window_rule=is_floating:1,app_id:^com.gabm.satty$


#Layer Rules
layer_rule=no_blur:1,no_animation:1,layer_name:selection
layer_rule=no_animation:1,layer_name:rofi
layer_rule=no_animation:1,layer_name:hyprpicker
