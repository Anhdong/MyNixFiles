# reload config
# bind=SUPER,r,spawn_shell,bash ~/.config/mango/scripts/config_check.sh
bind=SUPER,r,reload_config

# menu and terminal
bind=SUPER,Return,spawn,foot
bind=SUPER,space,spawn,noctalia msg panel-toggle launcher
bind=SUPER+ALT,space,spawn,noctalia msg panel-toggle control-center
bind=SUPER,comma,spawn,noctalia msg settings-toggle 

# exit
bind=SUPER+SHIFT,m,quit
# killclient
bind=SUPER,q,killclient

# switch window focus
# bind=SUPER,n,focusstack,next
# bind=SUPER,u,focuslast
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

# swap window
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right

# movewin
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# resizewin
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# switch window status
bind=SUPER,g,toggleglobal,
bind=SUPER,t,togglefloating,
bind=ALT,f,togglemaximizescreen,
bind=SUPER,f,togglefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=ALT,z,toggle_scratchpad

# switch layout
bind=SUPER,n,switch_layout

bind=Super,1,view,1,0
bind=Super,2,view,2,0
bind=Super,3,view,3,0
bind=Super,4,view,4,0
bind=Super,5,view,5,0
bind=Super,6,view,6,0
bind=Super,7,view,7,0
bind=Super,8,view,8,0
bind=Super,9,view,9,0

bind=SHIFT+SUPER,1,tag,1,0
bind=SHIFT+SUPER,2,tag,2,0
bind=SHIFT+SUPER,3,tag,3,0
bind=SHIFT+SUPER,4,tag,4,0
bind=SHIFT+SUPER,5,tag,5,0
bind=SHIFT+SUPER,6,tag,6,0
bind=SHIFT+SUPER,7,tag,7,0
bind=SHIFT+SUPER,8,tag,8,0
bind=SHIFT+SUPER,9,tag,9,0

bind=Alt,1,toggletag,1
bind=Alt,2,toggletag,2
bind=Alt,3,toggletag,3
bind=Alt,4,toggletag,4
bind=Alt,5,toggletag,5
bind=Alt,6,toggletag,6
bind=Alt,7,toggletag,7
bind=Alt,8,toggletag,8
bind=Alt,9,toggletag,9

bind=SHIFT+ALT,1,toggleview,1
bind=SHIFT+ALT,2,toggleview,2
bind=SHIFT+ALT,3,toggleview,3
bind=SHIFT+ALT,4,toggleview,4
bind=SHIFT+ALT,5,toggleview,5
bind=SHIFT+ALT,6,toggleview,6
bind=SHIFT+ALT,7,toggleview,7
bind=SHIFT+ALT,8,toggleview,8
bind=SHIFT+ALT,9,toggleview,9

# Mouse Button Bindings
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_middle,killclient
mousebind=SUPER,btn_right,moveresize,curresize


# Gesturebind
gesturebind=none,left,3,viewtoright_have_client
gesturebind=none,right,3,viewtoleft_have_client
gesturebind=none,up,3,toggleoverview,1
gesturebind=none,down,3,toggleoverview,1
gesturebind=none,left,4,focusdir,left
gesturebind=none,right,4,focusdir,right
gesturebind=none,up,4,focusdir,up
gesturebind=none,down,4,focusdir,down

# brightness, volume and screenshots
bind=none,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bind=none,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bind=none,XF86AudioMute,spawn,noctalia msg volume-mute
bind=none,XF86AudioMicMute,spawn,noctalia msg mic-mute
bind=none,XF86MonBrightnessUp,spawn,noctalia msg brightness-up
bind=none,XF86MonBrightnessDown,spawn,noctalia msg brightness-down

bind=none,XF86Cut,spawn, noctalia msg screenshot-region --annotate --copy-to-clipboard
bind=none,XF86Favorites,spawn,noctalia msg wallpaper-random

#custom app bind
bind=SUPER,b,spawn,zen
bind=SUPER,e,spawn,nautilus
bind=SUPER+SHIFT,e,spawn,foot -e yazi

bind=ALT,h,spawn,noctalia msg bar-toggle
bind=ALT,l,spawn,noctalia msg session lock
